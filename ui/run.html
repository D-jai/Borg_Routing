<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run - BORG_ROUTE</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main id="page" data-page="run" class="stack">
  <div class="row"><h1>Run</h1><span id="status-chip"></span><span class="muted small num" id="run-meta"></span><span id="live" class="stage hidden"><span class="spin" aria-hidden="true"></span><span>Live</span></span></div>
  <p class="muted small" id="loading">Loading the run...</p>
  <div id="content" class="stack hidden">
    <div class="card"><h3>Asked</h3><p class="prompt" id="prompt"></p><p class="small muted hidden" id="parent-line"></p></div>
    <p class="small muted" id="run-lane"></p>
    <div class="card failure hidden" id="failure"><h3>Why it failed</h3><p id="failure-words" style="margin:6px 0 4px"></p><p class="small muted" id="failure-detail" style="margin:0"></p></div>
    <div class="tiles" id="tiles"></div>

    <div class="split">
      <div class="card">
        <h2 style="margin-bottom:12px">Plan</h2>
        <div class="plan-scroll" id="plan-box"></div>
        <p class="small muted legend" style="margin:10px 0 0"><span class="dot local"></span> on this machine &nbsp; <span class="dot cloud"></span> cloud &nbsp; Select a step to see why its model was chosen.</p>
      </div>
      <aside class="card stack" id="panel" aria-live="polite"></aside>
    </div>

    <div class="split">
      <div class="card"><h2 style="margin-bottom:8px">What happened</h2><ol class="timeline" id="timeline"></ol></div>
      <div class="card hidden" id="left-card"><h2 style="margin-bottom:8px">What left this machine</h2><div id="left-list"></div></div>
    </div>
  </div>
</main>
<script src="assets/app.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/workspace.js"></script>
<script src="assets/pages/run.js"></script>
</body>
</html>
