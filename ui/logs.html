<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logs — BORG_ROUTE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f1a; color: #ddd; }
    nav { background: #1a1a2e; padding: 10px 20px; display: flex; gap: 20px; align-items: center; }
    nav .brand { font-weight: bold; color: #e94560; font-size: 1.1em; }
    nav a { color: #eee; text-decoration: none; }
    nav a:hover { color: #e94560; }
    .container { padding: 24px; max-width: 1300px; margin: 0 auto; }
    h1 { font-size: 1.3em; color: #e94560; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .toolbar input, .toolbar select { background: #1a1a2e; border: 1px solid #333; color: #ccc; padding: 6px 10px; border-radius: 4px; font-size: 0.85em; }
    .toolbar button { background: #e94560; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .toolbar button:hover { background: #c73450; }
    .toolbar .btn-secondary { background: #1a2a3a; color: #88aaff; }
    .toolbar .btn-secondary:hover { background: #223; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78em; }
    th { background: #1a1a2e; color: #777; padding: 6px 8px; text-align: left; border-bottom: 1px solid #2a2a3e; }
    td { padding: 5px 8px; border-bottom: 1px solid #1a1a2e; vertical-align: top; word-break: break-all; }
    tr:hover td { background: #151524; }
    .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 0.75em; }
    .model_call { background: #1a2a3a; color: #48f; }
    .orchestrator_decision { background: #1a3a1a; color: #4c4; }
    .child_residue { background: #3a2a1a; color: #c84; }
    .error { background: #3a1a1a; color: #c44; }
    .escalation { background: #2a1a3a; color: #c8f; }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #2a2a3e; }
    .tab { padding: 8px 18px; cursor: pointer; color: #888; font-size: 0.9em; border-bottom: 2px solid transparent; }
    .tab.active { color: #e94560; border-bottom-color: #e94560; }
    #cost-section { display: none; }
    #entities-section { display: none; }
    #loading { color: #555; font-size: 0.88em; }
  </style>
</head>
<body>
<nav>
  <span class="brand">BORG_ROUTE</span>
  <a href="/ui/chat.html">Chat</a>
  <a href="/ui/models.html">Models</a>
  <a href="/ui/dashboard.html">Dashboard</a>
  <a href="/ui/logs.html" style="color:#e94560">Logs</a>
  <a href="/ui/admin.html">Admin</a>
</nav>

<div class="container">
  <h1>Observability Logs</h1>

  <div class="tabs">
    <div class="tab active" onclick="showTab('events')">Events</div>
    <div class="tab" onclick="showTab('cost')">Cost Summary</div>
    <div class="tab" onclick="showTab('entities')">NER Entities</div>
  </div>

  <!-- Events Tab -->
  <div id="events-section">
    <div class="toolbar">
      <input id="filter-run" placeholder="Filter by run ID…" style="width:280px">
      <select id="filter-type">
        <option value="">All event types</option>
        <option value="model_call">model_call</option>
        <option value="orchestrator_decision">orchestrator_decision</option>
        <option value="child_residue">child_residue</option>
        <option value="escalation">escalation</option>
        <option value="error">error</option>
      </select>
      <button onclick="loadLogs()">Filter</button>
      <button class="btn-secondary" onclick="exportLogs()">Export JSONL</button>
    </div>
    <div id="loading">Loading…</div>
    <table id="log-table" style="display:none">
      <thead>
        <tr>
          <th>ID</th><th>Event</th><th>Run ID</th><th>Model</th>
          <th>Tokens In</th><th>Tokens Out</th><th>Cost $</th>
          <th>Latency ms</th><th>Created</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>

  <!-- Cost Tab -->
  <div id="cost-section">
    <div id="cost-loading">Loading…</div>
    <div id="cost-content" style="display:none">
      <table id="cost-table">
        <thead>
          <tr><th>Model</th><th>Calls</th><th>Tokens In</th><th>Tokens Out</th><th>Cost $</th></tr>
        </thead>
        <tbody id="cost-body"></tbody>
      </table>
      <p id="cost-totals" style="margin-top:12px; color:#888; font-size:0.82em;"></p>
    </div>
  </div>

  <!-- Entities Tab -->
  <div id="entities-section">
    <div class="toolbar">
      <input id="ent-run" placeholder="Filter by run ID…" style="width:260px">
      <input id="ent-label" placeholder="Label (PERSON, ORG…)" style="width:160px">
      <button onclick="loadEntities()">Filter</button>
    </div>
    <div id="ent-loading">Loading…</div>
    <table id="ent-table" style="display:none">
      <thead>
        <tr><th>Entity</th><th>Label</th><th>Run ID</th><th>Log ID</th></tr>
      </thead>
      <tbody id="ent-body"></tbody>
    </table>
  </div>
</div>

<script>
  function showTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const names = ['events','cost','entities'];
      t.classList.toggle('active', names[i] === name);
    });
    document.getElementById('events-section').style.display = name === 'events' ? '' : 'none';
    document.getElementById('cost-section').style.display = name === 'cost' ? '' : 'none';
    document.getElementById('entities-section').style.display = name === 'entities' ? '' : 'none';
    if (name === 'cost') loadCost();
    if (name === 'entities') loadEntities();
  }

  async function loadLogs() {
    const runId = document.getElementById('filter-run').value.trim();
    const type = document.getElementById('filter-type').value;
    let url = '/logs?limit=200';
    if (runId) url += '&run_id=' + encodeURIComponent(runId);
    if (type) url += '&event_type=' + encodeURIComponent(type);

    document.getElementById('loading').style.display = '';
    document.getElementById('log-table').style.display = 'none';
    const data = await fetch(url).then(r => r.json());
    const tbody = document.getElementById('log-body');
    tbody.innerHTML = '';
    (data.logs || []).forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${e.log_id}</td>
        <td><span class="badge ${e.event_type}">${e.event_type}</span></td>
        <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.run_id || ''}</td>
        <td>${e.model_id || ''}</td>
        <td>${e.tokens_input ?? ''}</td>
        <td>${e.tokens_output ?? ''}</td>
        <td>${e.dollars != null ? '$' + Number(e.dollars).toFixed(4) : ''}</td>
        <td>${e.latency_ms ?? ''}</td>
        <td style="white-space:nowrap">${(e.created_at||'').slice(0,19)}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('loading').style.display = 'none';
    document.getElementById('log-table').style.display = '';
  }

  async function loadCost() {
    document.getElementById('cost-loading').style.display = '';
    document.getElementById('cost-content').style.display = 'none';
    const data = await fetch('/logs/cost-summary').then(r => r.json());
    const tbody = document.getElementById('cost-body');
    tbody.innerHTML = '';
    (data.by_model || []).forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.model_id || '(unknown)'}</td><td>${r.call_count}</td>
        <td>${(r.total_tokens_in||0).toLocaleString()}</td>
        <td>${(r.total_tokens_out||0).toLocaleString()}</td>
        <td>$${Number(r.total_cost).toFixed(4)}</td>`;
      tbody.appendChild(tr);
    });
    const t = data.totals || {};
    document.getElementById('cost-totals').textContent =
      `Total: ${t.total_calls||0} calls · ${((t.total_tokens_in||0)+(t.total_tokens_out||0)).toLocaleString()} tokens · $${Number(t.total_cost||0).toFixed(4)}`;
    document.getElementById('cost-loading').style.display = 'none';
    document.getElementById('cost-content').style.display = '';
  }

  async function loadEntities() {
    const runId = document.getElementById('ent-run').value.trim();
    const label = document.getElementById('ent-label').value.trim();
    let url = '/logs/entities?limit=200';
    if (runId) url += '&run_id=' + encodeURIComponent(runId);
    if (label) url += '&label=' + encodeURIComponent(label);
    document.getElementById('ent-loading').style.display = '';
    document.getElementById('ent-table').style.display = 'none';
    const data = await fetch(url).then(r => r.json());
    const tbody = document.getElementById('ent-body');
    tbody.innerHTML = '';
    (data.entities || []).forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${e.text}</td><td><span class="badge model_call">${e.label}</span></td>
        <td style="font-size:0.75em">${e.run_id||''}</td><td>${e.log_id}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('ent-loading').style.display = 'none';
    document.getElementById('ent-table').style.display = '';
  }

  function exportLogs() {
    const runId = document.getElementById('filter-run').value.trim();
    let url = '/logs/export?limit=1000';
    if (runId) url += '&run_id=' + encodeURIComponent(runId);
    window.location.href = url;
  }

  loadLogs();
</script>
</body>
</html>
