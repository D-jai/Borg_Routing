<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs - BORG_ROUTE</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main id="page" data-page="logs" class="stack">
  <div class="row"><h1>Logs</h1><span class="chip">Admin</span></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="events" aria-selected="true">Events</button>
    <button type="button" role="tab" data-tab="cost" aria-selected="false">Cost summary</button>
    <button type="button" role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </div>

  <section id="tab-events" class="stack">
    <div class="actions">
      <input id="f-run" class="inline-input" style="width:260px" type="text" placeholder="Run id" aria-label="Filter by run id">
      <select id="f-type" class="inline-input" style="width:200px" aria-label="Event type">
        <option value="">All event types</option><option>model_call</option><option>orchestrator_decision</option>
        <option>child_residue</option><option>escalation</option><option>error</option>
      </select>
      <button class="btn" id="f-go" type="button">Filter</button>
      <button class="btn" id="f-export" type="button">Export JSONL</button>
    </div>
    <div class="card" id="events"><p class="muted small">Loading...</p></div>
  </section>

  <section id="tab-cost" class="stack hidden">
    <div class="tiles" id="cost-tiles"></div>
    <div class="card" id="cost"><p class="muted small">Loading...</p></div>
  </section>

  <section id="tab-stats" class="stack hidden">
    <div class="tiles" id="outcomes"></div>
    <div class="split">
      <div class="card"><h2 style="margin-bottom:8px">Tokens by model</h2><div id="leaderboard"></div></div>
      <div class="card"><h2 style="margin-bottom:8px">Feedback</h2><div class="tiles" id="feedback"></div></div>
    </div>
    <div class="card">
      <div class="row"><h2>Outlier runs</h2>
        <label class="small muted" for="o-sort">Ranked by</label>
        <select id="o-sort" class="inline-input" style="width:auto"><option value="cost">What they cost</option><option value="duration">How long they took</option></select>
      </div>
      <p class="small muted">Runs are ranked by logged dollars or by wall-clock time, never by how long the question was.</p>
      <div id="outliers"></div>
    </div>
    <div class="card"><h2 style="margin-bottom:8px">Runs and the runs they started</h2><div id="tree"></div></div>
  </section>
</main>
<script src="assets/app.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/pages/logs.js"></script>
</body>
</html>
