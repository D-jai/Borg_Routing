<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — BORG_ROUTE</title>
  <!-- BUG-021 — marked renders model markdown to HTML; DOMPurify scrubs
       any XSS payload that sneaks through (operator-verified fix). -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f1a; color: #ddd; display: flex; flex-direction: column; height: 100vh; }
    nav { background: #1a1a2e; color: #eee; padding: 10px 20px; display: flex; gap: 20px; align-items: center; flex-shrink: 0; }
    nav .brand { font-weight: bold; color: #e94560; font-size: 1.1em; }
    nav a { color: #eee; text-decoration: none; }
    nav a:hover { color: #e94560; }
    nav span.dim { color: #555; }
    #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #1e3a5f; align-self: flex-end; }
    .msg.assistant { background: #1a1a2e; border: 1px solid #333; align-self: flex-start; }
    .msg.system { background: #1a1a1a; border: 1px solid #444; align-self: center; font-size: 0.85em; color: #888; max-width: 90%; }
    .run-link { font-size: 0.75em; color: #555; margin-top: 4px; }
    .run-link a { color: #4080c0; text-decoration: none; }
    .run-link a:hover { text-decoration: underline; }
    .rating-bar { display: flex; gap: 6px; margin-top: 4px; }
    .rating-btn { background: none; border: 1px solid #333; color: #888; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 0.85em; }
    .rating-btn:hover { border-color: #e94560; color: #e94560; }
    .rating-btn.active-up { border-color: #4c4; color: #4c4; }
    .rating-btn.active-down { border-color: #c44; color: #c44; }
    #input-bar { background: #1a1a2e; border-top: 1px solid #2a2a3e; padding: 12px 20px; display: flex; gap: 10px; flex-shrink: 0; }
    #input-bar select { background: #0f0f1a; border: 1px solid #333; color: #ccc; padding: 8px; border-radius: 4px; font-size: 0.9em; }
    #user-input { flex: 1; background: #0f0f1a; border: 1px solid #333; color: #ddd; padding: 10px 14px; border-radius: 4px; font-size: 1em; resize: none; height: 42px; min-height: 42px; max-height: 160px; }
    #send-btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1em; }
    #send-btn:disabled { background: #555; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #c73450; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #555; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BUG-021 — markdown rendering inside assistant bubbles. Headings,
       lists, inline code, and links should look right out of the box. */
    .msg.assistant { white-space: normal; }
    .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 8px 0 4px; line-height: 1.3; }
    .msg.assistant h1 { font-size: 1.3em; }
    .msg.assistant h2 { font-size: 1.15em; }
    .msg.assistant h3 { font-size: 1.05em; }
    .msg.assistant p { margin: 6px 0; }
    .msg.assistant ul, .msg.assistant ol { margin: 6px 0 6px 20px; }
    .msg.assistant li { margin: 2px 0; }
    .msg.assistant a { color: #4080c0; text-decoration: underline; }
    .msg.assistant a:hover { color: #6aa0e0; }
    .msg.assistant code { background: #0a0a14; padding: 1px 4px; border-radius: 3px; font-family: monospace; font-size: 0.92em; }
    .msg.assistant pre { background: #0a0a14; padding: 8px 10px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
    .msg.assistant pre code { background: none; padding: 0; }
    .msg.assistant blockquote { border-left: 3px solid #444; padding-left: 10px; margin: 6px 0; color: #aaa; }
    .msg.assistant strong { color: #fff; }
    .msg.assistant table { border-collapse: collapse; margin: 6px 0; }
    .msg.assistant th, .msg.assistant td { border: 1px solid #333; padding: 4px 8px; }

    /* BUG-018 — stage indicator surfaces what the orchestrator is doing
       right now so 2-3 min runs don't look like the server is dead. */
    .stage-indicator { font-size: 0.85em; color: #888; }
    .stage-indicator .clock { color: #666; margin-left: 8px; font-variant-numeric: tabular-nums; }
    .stage-indicator .stage-label { color: #aac; }
  </style>
</head>
<body>
<nav>
  <span class="brand">BORG_ROUTE</span>
  <a href="/ui/chat.html" style="color:#e94560">Chat</a>
  <a href="/ui/models.html">Models</a>
  <a href="/ui/keys.html">API Keys</a>
  <a href="/ui/dashboard.html">Dashboard</a>
  <a href="/ui/logs.html">Logs</a>
  <a href="/ui/skills.html">Skills</a>
  <a href="/ui/admin.html">Admin</a>
</nav>

<div id="chat-area">
  <div class="msg system">Connected to BORG_ROUTE. Type a message to begin.</div>
</div>

<div id="input-bar">
  <select id="model-select">
    <option value="borg_route">borg_route (auto)</option>
    <option value="borg_route:light">borg_route:light</option>
    <option value="borg_route:mid">borg_route:mid</option>
    <option value="borg_route:heavy">borg_route:heavy</option>
    <option value="borg_route:coding">borg_route:coding</option>
    <option value="borg_route:reasoning">borg_route:reasoning</option>
    <option value="borg_route:local">borg_route:local</option>
  </select>
  <textarea id="user-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
  <button id="send-btn">Send</button>
  <button id="clear-btn" title="Clear conversation history (BUG-019)" style="background:#333;color:#ccc;border:1px solid #444;padding:10px 14px;border-radius:4px;cursor:pointer;">Clear</button>
</div>

<script>
  const chatArea = document.getElementById('chat-area');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const modelSelect = document.getElementById('model-select');

  // BUG-019 — persist the conversation thread across navigations. Without
  // this, switching tabs to /ui/admin.html and back wipes the page even
  // if the underlying run is still going. We store the rendered turns
  // (role + content + runId) in localStorage and restore on load.
  const THREAD_KEY = 'borg_route_chat_thread_v1';
  let thread = [];
  let renderedTurns = [];  // [{role, content, runId}] — what's currently in the DOM

  function persistThread() {
    try {
      localStorage.setItem(THREAD_KEY, JSON.stringify({
        thread,
        renderedTurns,
        savedAt: Date.now(),
      }));
    } catch (_) { /* quota exceeded etc — non-fatal */ }
  }

  function loadPersistedThread() {
    try {
      const raw = localStorage.getItem(THREAD_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.thread) || !Array.isArray(parsed.renderedTurns)) return;
      if (parsed.renderedTurns.length === 0) return;
      thread = parsed.thread;
      // Replace the static "Connected to BORG_ROUTE" banner with the
      // restored history so we don't double-render.
      chatArea.innerHTML = '';
      for (const turn of parsed.renderedTurns) {
        addMsg(turn.role, turn.content, turn.runId, /*persist=*/false);
      }
      renderedTurns = parsed.renderedTurns;
      // Surface a small system note so it's obvious the page was restored
      // rather than freshly loaded.
      const note = document.createElement('div');
      note.className = 'msg system';
      note.textContent = 'Restored from previous session. Click Clear to start over.';
      chatArea.insertBefore(note, chatArea.firstChild);
    } catch (_) { /* corrupted blob — drop it */ }
  }

  function clearChat() {
    thread = [];
    renderedTurns = [];
    try { localStorage.removeItem(THREAD_KEY); } catch (_) {}
    chatArea.innerHTML = '';
    const banner = document.createElement('div');
    banner.className = 'msg system';
    banner.textContent = 'Cleared. Type a message to begin.';
    chatArea.appendChild(banner);
  }

  // BUG-021 — render markdown to safe HTML for assistant bubbles only.
  // User bubbles stay literal so a pasted "## hi" appears as the user
  // typed it, not as a heading.
  function renderMd(text) {
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
      // CDN failed — fall back to literal so we never blow up the chat.
      return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    const html = marked.parse(text || '', { gfm: true, breaks: true });
    return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
  }

  // Open all rendered links in new tabs so following a citation doesn't
  // navigate away from the chat (which would currently lose the thread —
  // BUG-019 mitigates that, but the new-tab habit is still polite).
  function openLinksInNewTab(container) {
    container.querySelectorAll('a[href]').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }

  function addMsg(role, content, runId, persist = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'assistant' && content) {
      div.innerHTML = renderMd(content);
      openLinksInNewTab(div);
    } else {
      div.textContent = content;
    }
    chatArea.appendChild(div);
    if (runId) {
      const link = document.createElement('div');
      link.className = 'run-link';
      link.innerHTML = `<a href="/ui/run.html?id=${runId}" target="_blank">View run trace →</a>`;
      chatArea.appendChild(link);
    }
    chatArea.scrollTop = chatArea.scrollHeight;
    if (persist) {
      renderedTurns.push({ role, content, runId: runId || null });
      persistThread();
    }
    return div;
  }

  // BUG-018 — wall-clock + stage indicator. Builds the small element shown
  // inside the assistant bubble while we're waiting on the orchestrator.
  function attachStageIndicator(parent) {
    const wrap = document.createElement('div');
    wrap.className = 'stage-indicator';
    const spinner = document.createElement('span');
    spinner.className = 'spinner';
    const label = document.createElement('span');
    label.className = 'stage-label';
    label.textContent = 'Thinking…';
    const clock = document.createElement('span');
    clock.className = 'clock';
    clock.textContent = '0s';
    wrap.appendChild(spinner);
    wrap.appendChild(label);
    wrap.appendChild(clock);
    parent.innerHTML = '';
    parent.appendChild(wrap);

    const startedAt = Date.now();
    const tick = setInterval(() => {
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      const mm = Math.floor(secs / 60), ss = secs % 60;
      clock.textContent = mm > 0 ? `${mm}m${String(ss).padStart(2,'0')}s` : `${secs}s`;
    }, 1000);

    return {
      setStage(text) { label.textContent = text; },
      stop() { clearInterval(tick); },
    };
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = '';
    userInput.style.height = '42px';

    addMsg('user', text);
    thread.push({ role: 'user', content: text });
    persistThread();

    sendBtn.disabled = true;
    const thinkingDiv = addMsg('assistant', '');
    const stage = attachStageIndicator(thinkingDiv);

    try {
      const resp = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelSelect.value, messages: thread, stream: true }),
      });

      if (!resp.ok || !resp.body) {
        const errData = await resp.json().catch(() => ({}));
        stage.stop();
        thinkingDiv.textContent = `Error: ${errData.detail?.message || resp.statusText}`;
        return;
      }

      let fullText = '';
      let runId = null;
      let firstContentSeen = false;

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // Process complete SSE lines
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          let chunk;
          try { chunk = JSON.parse(payload); } catch { continue; }

          if (!runId && chunk.id) runId = chunk.id.replace('chatcmpl-', '');

          // BUG-018 — non-content chunks carry orchestrator stage info
          // (e.g. {"event":"stage","stage":"web_search","detail":"query: ..."}).
          // Update the indicator label without touching the bubble's
          // final text.
          if (chunk.event === 'stage') {
            const detail = chunk.detail ? ` — ${chunk.detail}` : '';
            const stageName = chunk.stage || 'orchestrator';
            stage.setStage(`${stageName}${detail}`);
            continue;
          }

          const delta = chunk.choices?.[0]?.delta?.content;
          if (delta) {
            if (!firstContentSeen) {
              // First real content has arrived — drop the indicator and
              // start writing into the bubble. Render-as-we-go via marked.
              stage.stop();
              thinkingDiv.innerHTML = '';
              firstContentSeen = true;
            }
            fullText += delta;
            // Re-render incrementally so headings/lists/links appear
            // formatted as they stream in (BUG-021).
            thinkingDiv.innerHTML = renderMd(fullText);
            openLinksInNewTab(thinkingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        }
      }

      stage.stop();
      if (!fullText) fullText = '(empty response)';
      thinkingDiv.innerHTML = renderMd(fullText);
      openLinksInNewTab(thinkingDiv);

      if (runId) {
        const link = document.createElement('div');
        link.className = 'run-link';
        link.innerHTML = `<a href="/ui/run.html?id=${runId}" target="_blank">View run trace →</a>`;
        thinkingDiv.after(link);
      }

      thread.push({ role: 'assistant', content: fullText });
      // BUG-019 — record the assistant turn into the persisted log so it
      // survives a navigation. The empty-bubble add() didn't persist
      // since content was empty.
      renderedTurns.push({ role: 'assistant', content: fullText, runId: runId || null });
      persistThread();

      if (runId) {
        const ratingBar = document.createElement('div');
        ratingBar.className = 'rating-bar';
        const upBtn = document.createElement('button');
        upBtn.className = 'rating-btn';
        upBtn.textContent = '👍';
        const downBtn = document.createElement('button');
        downBtn.className = 'rating-btn';
        downBtn.textContent = '👎';
        async function sendRating(val) {
          await fetch(`/runs/${runId}/rating`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rating: val }),
          });
          upBtn.className = 'rating-btn' + (val === 1 ? ' active-up' : '');
          downBtn.className = 'rating-btn' + (val === -1 ? ' active-down' : '');
        }
        upBtn.addEventListener('click', () => sendRating(1));
        downBtn.addEventListener('click', () => sendRating(-1));
        ratingBar.appendChild(upBtn);
        ratingBar.appendChild(downBtn);
        thinkingDiv.after(ratingBar);
      }
    } catch (err) {
      stage.stop();
      thinkingDiv.textContent = `Error: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  document.getElementById('clear-btn').addEventListener('click', clearChat);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  userInput.addEventListener('input', () => {
    userInput.style.height = '42px';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  });

  // BUG-019 — on page load, rehydrate the persisted thread so navigations
  // don't wipe the chat.
  loadPersistedThread();
</script>
</body>
</html>
