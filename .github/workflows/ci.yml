name: CI

# Work order 5.6. No secrets are used: the test suite runs on stand-ins and needs
# neither network nor an API key. The pushed tree's run here is the full test run.

on:
  push:
    branches: [showcase, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/ui runs app.js and workspace.js under node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: UI static check (strict)
        run: python scripts/check_ui_static.py --strict

      - name: Claims check
        run: python scripts/check_claims.py

  # Work order 5.2: build the image, start compose in replay mode, check it answers.
  # Runs once, after the tests, on GitHub's hosted runner. Docker never runs on the
  # maintainer's laptop (planner ruling 30d).
  compose_replay:
    name: compose replay install
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (replay mode, no .env)
        run: docker compose up -d --build --wait

      - name: Health
        run: curl -f --retry 15 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:8000/health

      - name: Ask page
        run: curl -f http://localhost:8000/ui/ask.html

      - name: Replay status answers in replay mode
        run: curl -f http://localhost:8000/replay/status | grep -q '"mode":"replay"'

      - name: A state-changing route is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/models/discover)
          echo "POST /models/discover -> $code"
          test "$code" = "403"

      - name: Live override merges
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.live.yaml config -q

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove
        if: always()
        run: docker compose down -v

  # Work order 4.6: every page in a real browser against the replay server, phone and desktop
  # width, light and dark (scripts/check_ui.py). Runs once, after the tests, on GitHub's hosted
  # runner. Playwright and a browser never run on the maintainer's laptop (planner ruling 38a).
  # On a failure, read the log lines and the ui-check artifact; fix locally, never re-run blind.
  ui_check:
    name: interface check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with the ui_test extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui_test]"
          python -m playwright install chromium --with-deps

      - name: Start the app in replay mode
        run: |
          PORT=$(python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1]); s.close()")
          echo "UI_PORT=$PORT" >> "$GITHUB_ENV"
          BORG_DEMO_MODE=replay nohup python -m uvicorn main:app --host 127.0.0.1 --port "$PORT" > uvicorn.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors "http://127.0.0.1:$PORT/health"

      - name: Interface check
        run: python scripts/check_ui.py --base-url "http://127.0.0.1:$UI_PORT" --out ui_check_out

      - name: Server log on failure
        if: failure()
        run: cat uvicorn.log

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: |
            ui_check_out/
            uvicorn.log
          if-no-files-found: warn
          retention-days: 14
