name: CI

# Work order 5.6. No secrets are used: the test suite runs on stand-ins and needs
# neither network nor an API key. The pushed tree's run here is the full test run.

on:
  push:
    branches: [showcase, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/ui runs app.js and workspace.js under node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: UI static check (strict)
        run: python scripts/check_ui_static.py --strict

      - name: Claims check
        run: python scripts/check_claims.py

  # DEFERRED until work orders 5.2 (Docker image and compose) and 4.5 (replay mode)
  # are built: build the image, start compose in replay mode, check /health and
  # /ui/ask.html. Add it as a second job here when both exist.
