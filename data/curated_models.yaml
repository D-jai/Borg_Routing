# Curated OpenRouter Model Pool — BORG_ROUTE
#
# Expert-selected set of 12 OpenRouter models chosen for spread across tiers.
# All were released within ~200 days of 2026-04-22. Discovery only pulls rows
# whose model_id (without the "openrouter/" prefix) appears here.
#
# To change the pool:
#   1. Edit this file (add/remove IDs).
#   2. Restart the server or hit POST /models/discover to re-pull.
#   3. Click "Get Model Info" on the Models page to re-score.
#
# Each entry is the OpenRouter model ID. The "notes" field is documentation
# only — it is not loaded into the matrix.

