title: Rolling summary compression for long conversations

summary_human: |
  When a conversation gets long, BORG_ROUTE compresses the older turns
  into a concise summary (3-8 sentences) so the orchestrator always has
  useful context without overloading its prompt window. The summary is
  produced by a model call, logged for auditability, and stored per
  thread. On the next run in that thread the summary is auto-loaded.

