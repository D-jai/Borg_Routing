    meaning: "Orchestrator selection degraded from quality_requirement=9.0 to 5.1 because no checked model met the bar. Emitted as type='error' / severity='warning' in the logs table; surfaced on the dashboard so operators can see 'ran without a qualifying brain'."

checklist:
  code_changes: yes
  tests_added: yes        # 4 new + 2 updated
  docs_updated: yes       # install-guide cold-start section + .env.example
  user_guide_updated: yes
  presentation_updated: no
  migration_needed: no    # no schema changes; uses existing event_type='error' bucket

learnings:
  - "Before designing a 'shortlist mechanism', read the existing curation
    and seeding code. BORG already had a curated 12-model OpenRouter pool
    with hand-seeded scores; the missing piece was just two checkboxes
    being false on a fresh install. The smaller, more honest fix beat
    the architectural one."
  - "Pre-checking exactly two models — one for instruction-following
    discipline, one for cost — covers both failure modes (operator hits
    a JSON-discipline edge case AND operator can't afford expensive
    runs) without bloating the default pool."
  - "When adding a trace event severity that doesn't fit existing buckets
    (logs.event_type CHECK constraint blocks 'warning'), reuse 'error'
    with a severity field in the decision JSON rather than fighting a
    schema migration. The dashboard can filter on the severity tag."
