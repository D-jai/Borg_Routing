id: BRT-INSTALL-FIX-05
timestamp: 2026-04-24T22:00:00Z
type: feat
scope: phase-4
title: "Cold-start orchestrator defaults — Sonnet 4.6 + Kimi K2 Thinking pre-checked, quality floor 9.0"

summary_human: |
  Stepping back to look at what BORG_ROUTE already meters for OpenRouter
  revealed that an entire "cold-start shortlist" mechanism was unnecessary:

    - data/curated_models.yaml already restricts discovery to 12 specific
      OpenRouter IDs.
    - data/capability_matrix.yaml already seeds those 12 with hand-assigned
      task_scores across 7 task types.
    - 6 of them already meet a 9.0 reasoning bar out of the box.
    - The Models page UI already drives the operator-controlled `checked`
      flag per row.

  The real cold-start gap was that all 12 rows shipped with `checked=false`,
  so a fresh install routed nothing. Operator had to tick boxes before
  any prompt could run. This slice fixes that with surgical changes.

  Decisions landed in this slice:

  1. Pre-check two cold-start defaults in data/capability_matrix.yaml:
     - openrouter/anthropic/claude-sonnet-4.6 (reasoning=9.0): rock-solid
       strict-JSON / instruction-following discipline; the safety net for
       the orchestrator's complex system prompt.
     - openrouter/moonshotai/kimi-k2-thinking (reasoning=9.2): about
       5–6× cheaper input/output than Sonnet; the cost optimiser will
       prefer this for most prompts.
     Both rows tagged with new `cold_start_default` specialty_tag so
     callers can find them programmatically. Other 10 OpenRouter rows
     remain `checked=false` so a fresh install doesn't spend heavily
     before the operator sees what's enabled.

  2. Raise default `orchestrator_quality_requirement` 6.5 → 9.0 across
     three places:
     - .env.example (with explanatory comment)
     - src/api/admin.py::_EFFECTIVE_SETTINGS (Admin UI default)
     - src/orchestrator/engine.py (function default + env fallback)

  3. New trace event BRT-ORC-NO-FRONTIER (severity=warning, type=error in
     the logs table since 'warning' isn't an allowed event_type). Emitted
     by _select_orchestrator_model when degrade fires from 9.0 → 5.1, so
     the dashboard / run timeline can flag any run that 'ran without a
     qualifying brain'. Code, severity, requested_quality, fallback_quality
     and task_type all surfaced in the decision payload. Fire-and-forget;
     never shadows the real selection.

  4. Models-page nudge banner: red banner on /ui/models.html that only
     shows when no row is checked anywhere across all sources, telling
     the operator their next prompt will fail with BRT-ORC-007 and naming
     Sonnet 4.6 + Kimi K2 Thinking as the recommended cold-start defaults.

  5. install-guide.md gains a "Cold-start defaults — pre-checked OpenRouter
     models" section explaining the two-model policy and why each was
     chosen.

  Tests: 4 new (TC-COLD-010 through TC-COLD-013). Two pre-existing tests
  (test_query_by_task_excludes_unchecked, test_router_ignores_unchecked_rows)
  updated to explicitly uncheck the seeded rows before testing the
  "nothing checked" assumption.

  Suite: 356 → 360 passed, zero net regressions.

