id: BRT-ZERO-01
timestamp: 2026-04-23T22:05:00Z
type: feat
scope: phase-3
title: Deterministic Rule Zero shortcut for trivial conversational prompts

summary_human: |
  The orchestrator prompt already contains Rule Zero ("Direct mode is the
  default; 70-80% of conversation turns should be Direct"), but the
  runtime still had to call plan mode to let the model decide
  direct_answer. That costs ~$0.0035 and 3-4 model calls on a trivial
  "hi". A rule-based pre-classifier now bypasses plan/re_plan entirely
  for unambiguously conversational short prompts: len < 500 chars, no
  list markers, and none of a short list of bulk phrases ("for each",
  "classify these", etc.). When the heuristic matches, orchestrate_run
  goes straight to compose — one orchestrator call. An
  orchestrator_decision event with mode=rule_zero_shortcut is written so
  the run trace shows the shortcut was taken. Opt out via
  BORG_RULE_ZERO_SHORTCUT=false or the rule_zero_shortcut config key.

files_touched:
  - src/orchestrator/engine.py
  - tests/orchestrator/test_rule_zero_shortcut.py
  - .env.example
