architectural_notes: |
  The heuristic is deterministic by design — no model call, no training,
  no drift. Conservative: if any check is uncertain, returns False and
  the full path runs. An LLM-based classifier was considered as Phase 3b
  if the rule proves too brittle in field use.

presentation:
  hero_bullet: "'hi' now costs one orchestrator call, not three. ~$0.0035 and 2-3 calls saved per trivial prompt; the decomposition overhead stays where it earns its keep."
  slide_angle: "Not every prompt needs a project manager. Cheap pre-classification is often smarter than clever post-hoc inference."
