id: BRT-STR-01
timestamp: 2026-04-23T22:00:00Z
type: feat
scope: phase-3
title: SSE streaming emits heartbeats during orchestration

summary_human: |
  POST /v1/chat/completions with stream=true used to stay silent until
  orchestrate_run finished, then word-stream the full response. On a 60-90s
  multi-node plan, browsers timed the fetch out with "NetworkError" before
  any bytes arrived. Now the endpoint wraps run_pipeline in a task and
  emits ": heartbeat <ts>" SSE comments every BORG_STREAM_HEARTBEAT_SEC
  (default 5) until the pipeline resolves. Keepalive comments are ignored
  by SSE consumers but reset their idle timers. Non-streaming and
  bypass-mode paths are unchanged.

files_touched:
  - src/api/chat_completions.py
  - tests/api/test_streaming_heartbeats.py
  - .env.example

public_surface:
  api:
    - "POST /v1/chat/completions (stream=true, model=borg_route*): emits SSE comment heartbeats during orchestration"

breaking_change: false

error_codes_added: []

env_vars_added:
