tests_added: { count: 2, note: "Long-pipeline heartbeats + fast-pipeline no-heartbeat happy path." }

audience: [developer, operator]
demo_value: high
user_visible: true
keywords: [streaming, sse, heartbeat, chat-completions, browser-timeout]

