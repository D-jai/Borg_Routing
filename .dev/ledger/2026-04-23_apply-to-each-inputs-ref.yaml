id: BRT-APE-01
timestamp: 2026-04-23T21:10:00Z
type: fix
scope: phase-2
title: apply_to_each resolves inputs_ref + empty-items is visible

summary_human: |
  Two related semantics fixes for apply_to_each. (1) The orchestrator
  prompt has always advertised `inputs_ref` as a string that "the
  runtime resolves from run state", but the runtime never did. Now
  `_build_task_from_node` looks up the upstream envelope by node id
  when `inputs_ref` is a string and extracts the first list found under
  `output.items` / `output.results` / `output.list`, stamping it into
  `dependency_input['items']` before dispatch. (2) Empty item lists used
  to resolve as phantom-success envelopes with 0 results, leaving the
  orchestrator to re-plan against nothing. Now they raise BRT-APE-005
  which surfaces as a failed envelope the orchestrator can see.

