learnings:
  - "marked + DOMPurify is the right combo for any markdown coming back
    from an LLM. Don't roll your own — DOMPurify catches `<img src=x
    onerror=alert(1)>` style payloads that a custom escape pass would
    miss. The CDN-vs-self-hosted decision is a separate discussion;
    documented in the ledger as 'consider self-hosting for offline /
    air-gapped installs'."
  - "The wall-clock counter alone is most of the perceived-progress UX
    win. Stage events are nicer but require server-side support; the
    counter is purely client-side and instantly silent the 'is the
    server dead?' panic. Counter first, stages second is the right
    sequencing."
  - "Polling logs.event_type='orchestrator_decision' for stage events
    is a cheap retrofit — every interesting stage transition already
    writes one. No engine changes needed; the existing trace events
    become the SSE wire format."
  - "localStorage persistence on EVERY delta (not just on completion)
    means a tab switch mid-stream still rehydrates correctly. Worth the
    write-amplification — the JSON blob is small and SQLite isn't
    involved."
