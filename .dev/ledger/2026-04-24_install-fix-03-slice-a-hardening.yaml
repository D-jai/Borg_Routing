learnings:
  - "Reasoning-family models are a separate model class for token budgeting
    purposes, not a variant of chat models. Hidden chain-of-thought counts
    against max_tokens but never appears in output; undersizing the cap is
    the #1 cause of empty / truncated responses from o1 / DeepSeek-R1."
  - "The answerer's structured output is a LOSSY summary of what it saw.
    Citations, URLs, and primary-source details get dropped even when the
    schema asks for them. Preserving raw tool_results on the envelope and
    exposing them to compose closes the loop: compose can always verify or
    re-cite from the original, even if the answerer's summary was poor."
  - "Rule Zero (direct-answer for simple prompts) needs a negative guard.
    Without one, orchestrators cheerfully bluff on time-sensitive questions
    from their training memory. The override clause ('bluffing is a
    run-breaking defect') shifts the default in the right direction without
    breaking trivial-chat throughput."
  - "Prompt engineering 'formatting discipline' must be explicit and
    checkable from within tests. Embedding specific rules (paragraph
    breaks, bullet thresholds, header syntax) makes the prompt itself
    regression-testable."
