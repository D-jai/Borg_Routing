id: BRT-INSTALL-FIX-03
timestamp: 2026-04-24T20:00:00Z
type: fix
scope: phase-4
title: "Slice A hardening — 5 install-time bugs (formatting, delegation, JSON tolerance, reasoning-model tokens, tool_results fold-in)"

summary_human: |
  Operator ran post-install prompts against BORG and surfaced five issues,
  all rooted in orchestrator / composer quality rather than plumbing:

  1. Token cap too low (2000 → needed 8000 for reasoning models).
  2. Orchestrator "decided to just continue" and stopped delegating on tasks
     that needed fresh data.
  3. Thinking models (DeepSeek-R1 / Qwen-QwQ style) returned JSON wrapped
     in <thinking>…</thinking> blocks; the extractor failed.
  4. Live news got captured by web_search but the composer's final answer
     ignored it — citations were being dropped between answerer and compose.
  5. Compose output was a wall of text; paragraphs, headers, bullets were
     all collapsed into one blob.

  Slice A landing: all five fixed in one pass, 20 new tests.

  Fix #1 — Reasoning-model token budget (BRT-ORC-RM)
    • New helpers in src/orchestrator/engine.py:
        _is_reasoning_model(model: ModelInfo) -> bool
        _resolve_max_tokens_for_model(model, env_var, default) -> int
    • Detects o1/o3/o4, DeepSeek-R1, Qwen-QwQ, Grok/Kimi/Gemini/Claude
      reasoning snapshots by model_id pattern AND honours
      specialty_tags=['reasoning'] as an explicit override.
    • Reasoning models get max(env*4, 8000) tokens; others keep env default
      (2000). Orchestrator and executor both call the helper, so both the
      planner and the leaf answerers get the bump when using a reasoning
      model. Tests: TC-RM-010a-e + TC-RM-011a-c.

  Fix #2 — Delegation discipline (Rule Zero Override)
    • Added a new "Rule Zero Override" block to ORCHESTRATOR_SYSTEM_PROMPT
      listing four MUST-decompose triggers:
        - current / time-sensitive info
        - specific verifiable facts about real entities
        - user-supplied URLs or documents
        - multi-step research
    • Explicit language: "It is better to run one small search than to
      bluff from memory. Bluffing is a run-breaking defect, not a
      cost-saving shortcut." Tests: TC-PROMPT-010b.

  Fix #3 — Tolerant JSON extractor (BRT-ORC-002)
    • src/orchestrator/engine.py::_extract_json rewritten to strip
      <thinking> / <think> / <reasoning> / <reason> / <analysis> /
      <scratchpad> wrappers (case-insensitive, attribute-tolerant) before
      attempting parse. New _strip_reasoning_wrappers helper.
    • Extraction order: raw → cleaned → fenced code block → greedy
      brace-match — each a layered fallback. Tests: TC-JSON-010,
      TC-JSON-011a-e.

  Fix #4 — tool_results survive fold-in (BRT-WEB-02)
    • Added `tool_results: dict = {}` field to InboundEnvelope
      (src/envelopes/schema.py). Executor populates it from the task's
      dependency_input at envelope construction time so raw citations
      land on the returned envelope, not just inside the answerer's
      ephemeral input context.
    • _invoke_orchestrator_model aggregates tool_results across all
      stage_results envelopes and feeds them into compose/re_plan via
      a new {tool_results} placeholder in the prompt.
    • Orchestrator prompt gains "Compose evidence discipline" clause
      telling the composer to trust raw citations over a thin answerer
      summary, and to flag mismatches in rationale.
      Tests: TC-WEB-020a-b, TC-PROMPT-010c.

  Fix #5 — Compose formatting discipline
    • Added "Compose formatting discipline (required)" section to
      ORCHESTRATOR_SYSTEM_PROMPT. Rules: paragraph breaks every 2-4
      sentences, bullet lists for 3+ enumerations, `##` headers for
      multi-section responses, **bold** for key terms, fenced code
      blocks for code/commands, explicit source citation for web_search
      output. "Never emit a single wall of text."
      Tests: TC-PROMPT-010a.

  Suite: 333 → 353 (+20 new, zero regressions). Pre-existing aiosqlite
  thread teardown warning unchanged.

