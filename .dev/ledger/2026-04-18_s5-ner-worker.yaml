id: BRT-S5-05
timestamp: 2026-04-18T19:20:00Z
type: feat
scope: slice-5
title: spaCy NER worker for log-payload entity and relation extraction

summary_human: |
  A background worker reads every text payload the system logs — prompts,
  outputs, decisions, errors — and pulls out structured facts: named
  entities (PERSON, ORG, GPE, DATE, MONEY, ...) and simple subject-verb-object
  triples. Results land in log_entities and log_relations and surface in
  the Logs UI. Parked by default (not auto-started); turn on when richer
  log analytics are worth the cost.

files_touched:
  - src/logging/ner_worker.py
  - src/db/schema.py

public_surface:
  added:
    - { kind: python_api, path: "src.logging.ner_worker.run_ner_worker", purpose: "Poll log_payloads and extract entities + relations" }

breaking_change: false

error_codes_added:
  - { code: BRT-LOG-010, meaning: "NER: spaCy model not available" }
  - { code: BRT-LOG-011, meaning: "NER: processing failed for a payload" }
  - { code: BRT-LOG-012, meaning: "NER: DB write failed after extraction" }
  - { code: BRT-LOG-013, meaning: "NER: worker poll error (recovered)" }

env_vars_added: []

dependencies_added:
  - { name: spacy, version: ">=3.8", purpose: "Entity + dependency parsing" }
  - { name: en_core_web_sm, kind: spacy-model, purpose: "English NER model — ~50 MB, download separately" }

tests_added: { count: 4 }

audience: [developer, operator]
demo_value: low
user_visible: true
keywords: [ner, spacy, logging, observability, parked]
notes: |
  Intentionally parked — not auto-started from FastAPI lifespan. Enable by
  adding `asyncio.create_task(run_ner_worker())` to main.py startup.
