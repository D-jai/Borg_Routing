learnings:
  - "Audit before designing. The schema was already 80% DB-conducive
    (log_entities, log_relations, ner_processed flag, full causal chain).
    The actual gap was 6 small fields and an export cursor — not a
    new architecture."
  - "Stamping provenance at write time (instance_id / source_version /
    domain_profile via lru_cached singletons) is cheaper and more
    reliable than reconstructing it from logs after the fact. One env-
    var read at process start, then free for the lifetime of the run."
  - "A denormalized read view (borg_db_interactions) decouples ROUTE's
    internal schema from downstream consumers. We can refactor logs +
    runs + log_payloads independently as long as the view contract holds."
  - "Confidence defaults of 0.85 (spaCy NER) and 0.6 (dep-parsed SVO)
    are industry rules-of-thumb. Document them, ship them, let DB's
    calibrator stage refine them on real data."
