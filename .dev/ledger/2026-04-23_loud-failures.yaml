id: BRT-ORC-02
timestamp: 2026-04-23T21:05:00Z
type: fix
scope: phase-2
title: Eliminate silent fallbacks in orchestrate_run

summary_human: |
  Three silent-fallback sites in engine.py used to mask broken runs. (1)
  When _select_orchestrator_model raised, the exception was swallowed and
  replaced with a synthetic ModelInfo(endpoint=""), which then crashed
  deep in httpx with no run trace. Now BRT-ORC-007 propagates. (2) When
  the default-answerer select_model call raised, the code fell back to
  the orchestrator model silently; it now emits BRT-ORC-015 so the
  fallback is visible in the run trace. (3) envelope save/update errors
  were swallowed by bare `except Exception: pass`; they now emit
  BRT-ORC-016 error events. The run still completes in both (2) and (3),
  but the trace shows the DB hiccup.

files_touched:
  - src/orchestrator/engine.py
  - tests/orchestrator/test_engine_loud_failures.py

public_surface: {}

breaking_change: false

error_codes_added:
  - BRT-ORC-015 (warning: default answerer fell back to orchestrator model)
  - BRT-ORC-016 (error: envelope persistence failed; run continues)
error_codes_behaviour_changed:
  - BRT-ORC-007 (now propagates instead of being silently replaced with an empty-endpoint placeholder)

env_vars_added: []

tests_added: { count: 3, note: "One test per fallback site." }

