id: BRT-INSTALL-FIX-01
timestamp: 2026-04-24T00:00:00Z
type: fix
scope: phase-4
title: Install-time bug triage — observability keystone + web_search + rule-zero

summary_human: |
  A fresh install on Ubuntu 24.04 surfaced a cluster of bugs that all
  traced to one root cause: the "loud failures" audit (BRT-ORC-02) stopped
  at the engine boundary, missing the larger silent-fallback one layer up
  in src/pipeline/runner.py. Error strings were captured into a return
  dict and then ignored by the API, so every downstream defect looked to
  the operator like "the whole run silently failed with no explanation."

  Eight findings were triaged; six were real code defects, one was benign
  (discovery caching was correct), one was test-suite residue leaking into
  the repo DB. This slice lands the fixes for all eight.

  Keystone observability fix (BUG-002 / BRT-PIP-010):
    • runs table gains a failure_reason TEXT column (migration is
      ALTER-safe; NULL default).
    • update_run_status(run_id, status, failure_reason=None, db_path=...)
      persists the reason whenever status='failed'.
    • pipeline/runner.py + api/tasks.py background runner both capture
      the traceback, emit an error event with code BRT-PIP-010, and call
      update_run_status with failure_reason=<the real error>.
    • GET /runs and GET /runs/<id> surface the column automatically
      because they serialise all row fields.
    • api/chat_completions.py replaces the generic "I was unable to
      complete this request" fallback with the real failure reason + a
      pointer to GET /runs/<id> for the trace.

  Orchestrator JSON hardening (BUG-008 / BRT-ORC-02b):
    • _invoke_orchestrator_model now sends response_format={type:
      json_object} on every call (LM Studio + OpenRouter both honour it).
    • write_event(orchestrator_decision) moved to BEFORE _extract_json so
      the raw payload_out is captured even when parsing raises.
    • One retry with a "JSON ONLY" reinforcement prompt after the first
      parse failure, then BRT-ORC-002 propagates so failure_reason is
      populated.

  Web search Perplexity rewrite (BUG-001):
    • _call_perplexity dropped the JSON-shape system prompt; uses a brief
      factual-summary instruction instead.
    • Reads body["citations"] (OpenRouter passes Perplexity's URL list
      through) and pairs URLs with prose snippet. Falls back to regex URL
      extraction from prose, then to a single "Synthesized" record — no
      more unparseable-JSON raises.
    • Model selected via BORG_PERPLEXITY_MODEL env var; default unchanged.

  Rule Zero hardening (BUG-003 / BRT-ZERO-01b):
    • _LIVE_DATA_TOKENS list added to _is_trivial_conversational:
      prompts containing 'latest', 'news', 'price of', 'weather', etc.
      no longer match the shortcut.
    • When the shortcut compose returns no direct response (i.e. leaks
      a plan), a reorchestration event with code BRT-ZERO-01-ESCALATED
      is emitted so cost-win telemetry doesn't double-count the run.

  Static UI polish (BUG-005):
    • New ui/index.html directory page listing all 8 surfaces.
    • main.py mounts StaticFiles with html=True so /ui/ serves it.

  Test residue cleanup (BUG-006):
    • tests/conftest.py gains a session-scoped autouse fixture
      _cleanup_db_residue that wipes well-known test-only user
      instructions from data/borg_route.db at session teardown.
    • .gitignore already correctly excluded the DB file; no change
      needed there.

  Discovery hardening (BUG-007):
    • New test TC-REG-066 asserts discover_all with every LM Studio
      port refused seeds zero live lmstudio rows and reconciles any
      pre-existing ghosts. Confirmed the original reported behaviour
      was benign (LM Studio was actually up).

  Install guide polish (NTH-1):
    • Environment Variables section rewritten as four grouped tables
      (provider credentials, scorer, web-search, orchestrator knobs,
      behaviour toggles) with defaults and one-line rationales.

  Chat UI deep-linking (NTH-2):
    • Already present — verified that chat.html addMsg() and the SSE
      chunk handler both insert a "View run trace →" link anchored at
      /ui/run.html?id=<run_id> for every assistant bubble.

