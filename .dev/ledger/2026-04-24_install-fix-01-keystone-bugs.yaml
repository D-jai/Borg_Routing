architectural_notes: |
  Two generalisable lessons from this slice:

  1. Observability audits must not stop at module boundaries. The
     BRT-ORC-02 audit correctly killed silent fallbacks inside
     orchestrate_run, but the biggest silent fallback lived one layer
     up in pipeline/runner.py. Future audits should trace error flow
     from the API surface all the way to the leaf call, not just
     inside the subsystem being audited.

  2. Mock-based tests for external providers must match real provider
     shape, not the shape you *asked for* via system prompt. The
     Perplexity test mocked strict JSON content because that's what the
     system prompt demanded. Real Sonar returned prose + a citations
     sibling; the mock was happy, the production call raised. Provider
     tests should assert against recorded real responses (or the
     provider's documented contract), not against the schema your
     prompt hoped for.

presentation:
  hero_bullet: "Install works. Failed runs now tell you why they failed, web_search stops choking on real Perplexity output, and Rule Zero no longer tries to answer 'what's today's news' from cache."
  slide_angle: "The cheapest bug is the one you never ship. The second cheapest is the one that shouts the moment it fires. This slice closes three observability gaps that were making debugging feel like a systemic failure — and the codebase was fine the whole time."
