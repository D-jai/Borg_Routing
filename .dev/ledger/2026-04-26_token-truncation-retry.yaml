id: BRT-ANS-009-TRUNCATION-RETRY
timestamp: 2026-04-26T18:30:00Z
type: fix
scope: phase-4
title: "Auto-retry on finish_reason=length + envelope cap as floor (BUG-009 / BUG-012)"

summary_human: |
  External LLM observer ran a Go-implementation-plus-tests prompt and
  noticed the run failed with the BRT-ANS-004 (unparseable JSON) cascade.
  Audit confirmed three related defects feeding the cascade:

  1. The answerer executor (`_call_model`) ignored
     `WrappedTask.max_output_tokens` entirely — it only honoured the
     `ANSWERER_MAX_TOKENS` env var. So even when the schema field said
     1000 (the old default), the actual cap was the env var; the
     observer's "envelope overrides env" theory was wrong. But the
     dead `max_output_tokens` field was still misleading and unusable
     by the orchestrator for per-node headroom requests.
  2. Neither the answerer nor the orchestrator path checked
     `finish_reason == "length"`. When a provider stopped at the cap,
     the response was almost always a partial JSON object, which then
     tripped BRT-ANS-004 / BRT-ORC-002 with no signal that "the cap
     was too small" was the actual cause. Operators saw an obscure
     downstream parse error instead of the real problem.
  3. `_build_task_from_node` discarded any `max_output_tokens` the
     orchestrator's plan node declared — the planner couldn't grant
     a code-heavy node more headroom even if it tried.

  Fix is surgical and lives in three places:

  ## src/agents/executor.py
    - `_call_model` now accepts a `requested_max_tokens` parameter
      (the envelope's per-node ask). Computes
      `effective_max = max(env_cap, requested)` so a planner-declared
      higher cap wins, while the env var remains a floor for cold-start
      configs.
    - Returns a 4-tuple `(content, tokens_in, tokens_out, finish_reason)`.
    - Auto-retry: if `finish_reason == "length"`, makes ONE more call
      with the cap doubled (bounded by `_TRUNCATION_RETRY_CEILING = 16000`).
      The retry's tokens accumulate into the returned totals so cost
      accounting stays accurate.
    - Factored the actual POST into `_post_chat_completion` so the retry
      shares one wire-format implementation.
    - `_execute_answerer` now passes `task.max_output_tokens` into
      `_call_model`. After the call, if `finish_reason == "length"`
      STILL, it returns a failed envelope tagged BRT-ANS-009 ("cap
      exhausted after retry — raise ANSWERER_MAX_TOKENS or split the
      task") instead of letting the truncated text fall into the
      JSON parser and surface as the misleading BRT-ANS-004.
    - The model_call event for BRT-ANS-009 includes the envelope's
      requested cap so operators can see "this node asked for X, the
      retry doubled it, and X*2 was still too small".

  ## src/orchestrator/engine.py
    - `_post_and_collect` now also returns `finish_reason`.
    - Added a length-retry block before the existing parse-failure
      retry: if the orchestrator's first call comes back with
      `finish_reason == "length"`, double the cap (ceiling 16k) and
      re-POST. New error code BRT-ORC-018 documents the case for the
      registry. The existing JSON-only-reinforcement retry still runs
      when the parse genuinely fails for a non-truncation reason.
    - `_build_task_from_node` now reads `node.get("max_output_tokens")`
      and stamps it on the resulting `WrappedTask`. Plan nodes that
      legitimately need headroom (Go impl + 3 tests, full spec
      generation) can declare a 6k/8k/12k cap and the executor will
      honour it.

  ## src/envelopes/schema.py
    - Schema default for `max_output_tokens` bumped from 1000 -> 4000.
      The old value was a vestige from before the field was wired to
      anything; 4000 fits the typical "answerer JSON envelope + 1-2
      paragraphs of content" comfortably while still triggering the
      retry on the truly large outputs.
    - Inline comment now explains the floor-vs-cap semantics so future
      readers don't repeat the observer's misreading.

  ## .env.example
    - Added an explanatory block above ORCHESTRATOR_MAX_TOKENS /
      ANSWERER_MAX_TOKENS describing the floor semantics and the new
      retry-on-length behaviour.

  ## Tests
    - tests/agents/test_executor.py: every existing 3-tuple
      `_call_model` mock updated to a 4-tuple with `finish_reason="stop"`.
      Three new tests:
        - TC-ANS-009: first POST returns `finish_reason="length"` with
          partial JSON; second POST returns clean JSON. Envelope must
          be `resolved`, both calls' tokens accumulate, exactly two
          POSTs were made.
        - TC-ANS-010: both POSTs return `finish_reason="length"` →
          envelope is `failed` with `BRT-ANS-009` in the failure
          reason; tokens still recorded.
        - TC-ANS-011: a task with `max_output_tokens=9000` while
          `ANSWERER_MAX_TOKENS=2000` → wire payload's `max_tokens`
          is 9000 (envelope-as-floor honoured).
    - tests/agents/test_executor_openrouter.py: 4-tuple unpacking
      and the response shape now includes `finish_reason: "stop"`.
    - tests/agents/test_executor_tool_requests.py: `_patch_model_call`
      fake signature updated to accept the new `requested_max_tokens`
      kwarg and return a 4-tuple.
    - tests/envelopes/test_schema.py: assertion bumped 1000 -> 4000
      with a comment pointing back at BRT-ANS-009.

  Suite: 388 -> 391 passed. Zero regressions.

  ## Why this matters

  This kills the silent-truncation cascade end-to-end. Pre-fix, a model
  hitting its cap mid-JSON produced a BRT-ANS-004 parse failure that
  looked like "the model was confused" and hid the real cause. Now:
    - The answerer floors its cap at the planner's request (so a Go
      impl + 3 tests node can ask for 8k tokens instead of being
      stuck at 2k).
    - Both stages auto-recover from a one-shot truncation by doubling
      the cap and retrying once.
    - When the cap genuinely is too small, the failure is loud and
      localised (BRT-ANS-009 / BRT-ORC-018) instead of cascading
      downstream into BRT-ANS-004 / BUG-020.

