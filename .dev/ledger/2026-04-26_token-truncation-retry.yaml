presentation:
  hero_bullet: |
    Silent truncation no longer fails runs. When a model hits the cap
    mid-JSON, BORG auto-retries once at double the budget, then
    surfaces a clean BRT-ANS-009 only when the cap really is too small.
  slide_angle: |
    The right error at the right layer. Truncation is a token-budget
    problem, not a JSON-parser problem — make the failure mode look
    like the cause, not the symptom.
  demo_script:
    - "Set ANSWERER_MAX_TOKENS=500 in .env and re-run a non-trivial coding prompt. Pre-fix: BRT-ANS-004 cascade, run fails."
    - "Post-fix: executor retries ONCE at double the cap (500 -> 1000); the run usually succeeds on that retry. If the retry is also cut off: BRT-ANS-009 with a 'raise the cap' hint."

notes: |
  Decision log:
    - Considered making the retry capable of unbounded doubling. Rejected
      because (a) a runaway retry on a misconfigured prompt could burn
      $$$ before any operator notices, (b) 16k is well above any
      real-world answerer JSON envelope, and (c) the right place to
      handle "the answer is genuinely 30k tokens" is upstream — the
      orchestrator should split into multiple nodes (which the new
      node-level max_output_tokens plumbing now supports).
    - Considered a 3rd retry. Rejected: by the second cap-doubling we're
      at >= 16k tokens; if a single answerer call really needs more
      than that, the planner failed to decompose and the right
      diagnostic is "split the task", not "throw more tokens at it".
    - Considered making the schema default match ANSWERER_MAX_TOKENS at
      runtime (e.g. read the env at construction time). Rejected as
      magical — the schema is a static contract; operators reading the
      schema should see one number, not a runtime-resolved value. The
      floor logic is in `_call_model` where the caller can see the
      effective number in the wire payload.
