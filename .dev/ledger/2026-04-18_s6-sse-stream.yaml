# --- User-guide signal (optional — populate when user_visible: true) ---
user_guide:
  heading: Live Run Trace
  how_to_use:
    - Open http://localhost:8000/ui/run.html?id=<run_id> while a run is still in progress.
    - A green pulsing dot labelled "Live" appears in the top bar while the stream is active.
    - Envelope rows appear and update in real time as the orchestrator dispatches them.
    - The apply_to_each counter ticks upward as parallel subtasks launch.
    - When the run finishes the dot changes to "Completed" or "Failed" and the stream closes.
    - No refresh is needed — everything updates automatically.
  troubleshooting:
    - symptom: Dot stays grey / nothing updates.
      cause_and_fix: The run is already finished — live stream only fires on in-progress runs.
    - symptom: Page shows "Stream abandoned".
      cause_and_fix: The browser tab was backgrounded too long. Reload the page.

