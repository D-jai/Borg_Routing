user_guide:
  heading: Discovering Models
  how_to_use:
    - Start your local model server (LM Studio on ports 1234-1237, or Ollama at http://localhost:11434) if you want local models in the matrix.
    - Open http://localhost:8000/ui/models.html in your browser.
    - Click "Discover Models" at the top of the page.
    - The table refreshes with every model found, including context length, tier, estimated cost, and throughput.
    - Click "Benchmark" on any row to measure that model's actual quality and speed.
  troubleshooting:
    - symptom: No models appear after clicking Discover.
      cause_and_fix: LM Studio or Ollama is not running, or is on a non-default port. Check the ports above.
    - symptom: OpenRouter models missing.
      cause_and_fix: Add an OpenRouter API key on the Keys page and re-run discovery.

install_guide:
  prerequisites_added:
    - { name: "LM Studio (optional)", where: "https://lmstudio.ai", purpose: "Run local models on ports 1234-1237" }
    - { name: "Ollama (optional)",    where: "https://ollama.ai",    purpose: "Run local models at :11434" }
    - { name: "OpenRouter API key (optional)", where: "https://openrouter.ai", purpose: "Access hosted models" }
  setup_steps:
    - If you want OpenRouter models, copy .env.example to .env and set OPENROUTER_API_KEY, or paste the key via /ui/keys.html.
    - Restart the server after changing .env (not needed if you used the Keys UI).

presentation:
  hero_bullet: Point BORG_ROUTE at your machine — it finds every model by itself.
  demo_script:
    - Open /ui/models.html on an empty install.
    - Start LM Studio with one model loaded.
    - Click "Discover Models".
    - Show the table populate with real pricing, context length, and throughput columns.
  slide_angle: Zero config. One button. The lineup is discovered, not declared.
