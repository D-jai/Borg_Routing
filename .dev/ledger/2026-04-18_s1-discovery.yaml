  - src/registry/discovery.py
  - src/api/models.py
  - ui/models.html

public_surface:
  added:
    - { kind: endpoint, path: "POST /models/discover", purpose: "Scan providers and populate capability matrix" }
    - { kind: endpoint, path: "GET /models/matrix", purpose: "Return current matrix" }

