id: BRT-VAL-01
timestamp: 2026-04-23T21:00:00Z
type: fix
scope: phase-2
title: Validator handles JSON-Schema-shaped output_schema

summary_human: |
  validate_inbound used to iterate the top-level keys of output_schema and
  require each to be present in env.output. When the orchestrator emitted a
  JSON-Schema-shaped schema ({"type":"object","properties":{...},"required":[...]})
  the validator demanded the meta-keys type/properties/required in every
  answerer output — throwing away perfectly valid {recommendation, reason}
  returns with "missing keys ['type','properties','required']". The fix
  walks into properties and honours required; flat-shape schemas are
  unchanged.

files_touched:
  - src/envelopes/validator.py
  - tests/envelopes/test_validator_json_schema.py

public_surface: {}

breaking_change: false

error_codes_added: []
error_codes_fixed:
  - BRT-ENV-011 (now fires only for real field names, never meta-keys)

env_vars_added: []

tests_added: { count: 2, note: "Happy + one failure-path for JSON-Schema shape." }

audience: [developer, operator]
demo_value: medium
user_visible: true
