learnings:
  - "Reasoning-class models already do internal reflect-refine in their
    hidden chain-of-thought. Wrapping them in an external N-pass loop
    pays twice for the same work and adds latency for trivial prompts.
    Pure prompt-level instructions to 'gauge complexity, then reflect
    proportionally' beat hardcoded loops on every axis: cost, latency,
    code complexity, revertibility."
  - "Escalation can be a single emitted JSON node, not a separate API
    call. Letting the orchestrator declare 'this needs a bigger brain'
    via `recommended_model` on an `orchestrate` node folds a multi-step
    routing decision into one inference. Saves a round trip and keeps
    the trace clean."
  - "Prompt clauses are testable. Asserting that specific phrases
    ('Adaptive Internal Reasoning', 'frontier', 'recommended_model')
    survive in ORCHESTRATOR_SYSTEM_PROMPT keeps the prompt regression-
    proof against future edits that might silently delete them."
