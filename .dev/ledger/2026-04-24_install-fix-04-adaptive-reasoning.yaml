id: BRT-INSTALL-FIX-04
timestamp: 2026-04-24T21:00:00Z
type: feat
scope: phase-4
title: "Adaptive Internal Reasoning — orchestrator self-decides reflection depth"

summary_human: |
  Original Slice B sketch had a hardcoded three-pass WBS loop (draft →
  critique → finalise) wrapping every orchestrator call. Operator pushed
  back: a "hello" doesn't deserve three passes; let the model itself
  decide how deep to think based on task complexity.

  This is the better idea on every axis:
    - Adaptive cost — trivial prompts reflect zero passes, complex ones
      reflect as many as the model deems necessary.
    - Reasoning-class models (o1, R1, QwQ, Gemini-thinking) already do
      draft/critique/refine inside their hidden chain-of-thought; an
      external 3-pass loop pays for the same work twice.
    - Pure prompt engineering — zero new control flow, zero new state
      machines, ship-friendly, revert-friendly.

  This slice ships the prompt-only change. Three new clauses appended to
  ORCHESTRATOR_SYSTEM_PROMPT, just above Rule Zero:

  1. "Adaptive Internal Reasoning" — names three complexity tiers
     (Trivial / Moderate / Complex) and tells the model to choose
     reflection depth proportionally. Explicit language: "you — not a
     hardcoded loop — decide how deep to go."

  2. "Do NOT emit your reasoning steps in the response" — the model
     uses internal review privately. Only the `rationale` field may
     hint with phrases like "verified via internal review."

  3. "Escalation — When You Are Not The Right Brain" — when a task
     genuinely needs a frontier-class brain beyond the orchestrator's
     own, emit a single `orchestrate` node with `recommended_model`
     set to a frontier model id. Keep escalation rare.

  The third clause folds what was originally a separate "frontier-or-not
  pre-gate" call into the orchestrator's own decision loop — one brain,
  one decision, no extra round trip.

  Tests: 3 new (TC-PROMPT-011a-c). Full suite 353 → 356, no regressions.

  What this defers (intentionally, for a future Slice B):
    - Cold-start orchestrator shortlist (so fresh installs work before
      the scorer has scored anything).
    - Hard `orchestrator_quality_requirement = 9.0` floor with degrade.
  Both still need design work and config hygiene; this slice doesn't
  block on them.

