architectural_notes: |
  The Option B+ design was chosen over model-native tool-calling (Option
  A) and hybrid whitelist (Option C) because:

  1. Local models (gemma, qwen, llama via LM Studio/Ollama) support
     tool-calling inconsistently; pre-fetching works for every model
     equally.
  2. The one-HTTP-call-per-envelope invariant is preserved; tokens and
     latency stay legible per envelope.
  3. Runaway cost from tool-call loops is impossible — the orchestrator's
     max_depth bounds total search spend deterministically.

  Upgrade path to Option A is kept open: a future `allow_model_tools:
  bool = False` field on WrappedTask would let the executor bind tools
  onto the chat-completions payload and run a bounded in-model loop
  when that opt-in is set. Option B+ stays the default.

  Inbox (BRT-INBOX-01) and outbox (BRT-OUTBOX-01) will register under
  the same dispatcher as additional tools — no new primitives needed.
  This slice lays the foundation.

presentation:
  hero_bullet: "BORG_ROUTE learns to look things up. One new package, one new runtime tool, and the scorer/runtime asymmetry is gone — with local models getting search access for the first time."
  slide_angle: "The cheapest implementation of model-grade tool calling is to do the tools BEFORE the model call. Pre-fetch, inject, one round-trip per envelope, bounded cost, works with any model including the ones in your LM Studio. We turned a hard protocol problem into a plan-time decision."
