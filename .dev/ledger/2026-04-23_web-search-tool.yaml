id: BRT-WEB-01
timestamp: 2026-04-23T23:45:00Z
type: feat
scope: phase-4
title: Native web_search runtime tool — Tavily primary, Perplexity fallback

summary_human: |
  BORG_ROUTE gains its first runtime tool, closing the scorer/runtime
  asymmetry flagged in the deferred-capabilities section of Bug
  Report.md. The scorer has web access (for model capability research);
  runtime now has it too.

  Design: "Option B+" (orchestrator-driven adaptive search). The
  executor pre-fetches tool results BEFORE the LLM call, injects them
  into the prompt, and loops ONLY via the existing orchestrator re_plan
  DAG — no in-model tool-calling loops. This means every answerer model
  (local gemma, cloud claude, anything that speaks chat-completions)
  gets search access equally. Local-first is preserved.

  The orchestrator prompt teaches a broad + narrow heuristic: for any
  research question, emit two parallel web_search nodes, inspect both
  result sets in re_plan, then either compose or spawn 1-2 refined
  searches. max_depth bounds the overall spend.

  Providers: Tavily (cheap, fast, raw results) is primary; Perplexity
  Sonar via OpenRouter is the silent fallback. Missing TAVILY_API_KEY
  degrades silently to Perplexity and logs BRT-TOOL-DEGRADED once per
  process. If both providers fail, the envelope returns
  status=failed with BRT-TOOL-002 and the orchestrator's re_plan step
  decides what to do.

  Envelope shape: WrappedTask grows a tool_requests: list[ToolRequest]
  field (default []). validate_outbound rejects hallucinated tool names
  with BRT-TOOL-000 BEFORE dispatch. Plans without tool_requests are
  unchanged; zero impact on Phase 1-3 behaviour.

  Architecture: new src/tools/ package — BaseTool ABC, ToolInvocationResult,
  ToolError, TOOL_REGISTRY, run_tool_requests dispatcher. Inbox and
  outbox (future BRT-INBOX-01 / BRT-OUTBOX-01) will register under the
  same dispatcher — one shape, three capabilities.

