env_vars_added:
  - { name: TIME_COST_PER_SEC,                 required: false, purpose: "Default 0.0001. Fallback for Admin UI value." }
  - { name: ORCHESTRATOR_QUALITY_REQUIREMENT,  required: false, purpose: "Default 6.5. Fallback for Admin UI value." }

tests_added: { count: 5 }

audience: [developer, operator]
