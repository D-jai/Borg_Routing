id: BRT-RT-01
timestamp: 2026-04-23T20:15:00Z
type: feat
scope: phase-1
title: Local-dev router defaults; Admin UI time-cost knob wired end-to-end

summary_human: |
  Router defaults now favour a single-developer local setup: time_cost_per_sec
  drops from 0.0083 (~$30/hr) to 0.0001 and the orchestrator quality bar drops
  from 8.0 to 6.5. This lets mid-tier local models (e.g. the 6.8-reasoning
  gemma-4-26b-a4b) qualify for orchestration once Get Model Info has run —
  no frontier API key required. Both knobs are editable via Admin UI → Settings
  and are re-read on every orchestrate_run() call (no restart).

files_touched:
  - src/registry/cost.py                # _DEFAULT_TIME_COST_PER_SEC → 0.0001
  - src/registry/router.py              # mirrored default
  - src/orchestrator/engine.py          # reads quality_req + time_cost from config
  - .env.example                        # TIME_COST_PER_SEC, ORCHESTRATOR_QUALITY_REQUIREMENT
  - tests/registry/test_router_local_first.py        # new (3 tests)
  - tests/api/test_admin_routing_knobs.py            # new (2 tests)

public_surface:
  added:
    - { kind: env_var, path: "TIME_COST_PER_SEC",                 purpose: "Fallback if Admin UI hasn't written time_cost_per_sec to DB." }
    - { kind: env_var, path: "ORCHESTRATOR_QUALITY_REQUIREMENT",  purpose: "Fallback if Admin UI hasn't written orchestrator_quality_requirement to DB." }

breaking_change: false
breaking_change_notes: |
  Existing installs that previously set time_cost_per_sec via the DB config
  keep that value — the new default only applies when no config exists.

