learnings:
  - Writing to .env at runtime is a tarpit (containerised deploys, secrets,
    load_dotenv is one-shot). Clean model is DB config → env → default with
    the UI read-only. Operators edit .env manually and reload.
  - Every hardcoded HTML `value="..."` is a latent lie. If the UI reads
    state from an endpoint, the endpoint must be the single source of truth.
  - `asyncio.wait_for` around the root task is sufficient to cancel every
    leaf call because CancelledError propagates through `async with` /
    aiohttp / httpx cleanly.
