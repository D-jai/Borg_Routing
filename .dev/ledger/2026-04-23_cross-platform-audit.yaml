architectural_notes: |
  Things that did NOT need fixing (documented here so the next audit can
  skip them):
  - Unix-only imports: none.
  - subprocess / os.system / shell=True: none. All I/O is via httpx or
    aiosqlite.
  - sys.platform / os.name / platform.system checks: none. No dead
    branches.
  - WindowsSelectorEventLoopPolicy: not needed. We don't use subprocess,
    so ProactorEventLoop (uvicorn's Windows default) works fine.
  - Data directory creation: not needed. data/ is committed with seed
    YAML + curated model list; SQLite auto-creates the .db file.
  - UI / shell scripts: none exist. No .sh / .bash / .ps1 / .bat / .cmd
    files in the repo.

  Deferred (not in this slice):
  - docs/install-guide.md stale test count of "256 passing" updated here
    but the fact that it drifts every phase suggests Bug Report §4's
    original recommendation to generate this number from the test run in
    CI (part of a future BRT-CI-01 slice).

presentation:
  hero_bullet: "BORG_ROUTE runs on Windows and Linux out of the box. Pure-Python, pure-httpx, pure-SQLite; no OS-specific code paths needed. This audit confirms it — three tiny polish fixes found, zero portability bugs."
  slide_angle: "Portability by default is a property of discipline, not a feature. By sticking to standard-library cross-platform idioms throughout the build (pathlib, encoding=utf-8, forward-slash path literals, no subprocess), the audit finished in one session with three-line diffs."
