id: BRT-XPLAT-01
timestamp: 2026-04-23T23:00:00Z
type: fix
scope: phase-4
title: Cross-platform (Linux/Windows) audit — three polish fixes

summary_human: |
  Systematic scan of src/, tests/, main.py, docs/, ui/ for Linux/Windows
  compatibility issues. Result: the codebase is already largely portable.
  No Unix-only imports (fcntl/termios/pwd/grp/resource/syslog), no
  subprocess/shell invocations, no platform gates (sys.platform/os.name),
  no hardcoded /tmp | /var | C:\ paths. All open() calls pass
  encoding="utf-8". Paths use forward-slash literals or pathlib.Path
  (both Python-normalised). LM Studio and Ollama run on identical ports
  on all three OSes.

  Three minor polish items found and fixed:

  1. .gitattributes was near-empty (only "export-ignore"), triggering
     "LF will be replaced by CRLF" warnings on every Windows commit.
     Added "* text=auto eol=lf" so repo storage stays LF-normalised for
     all contributors, plus explicit binary patterns for images and DB
     files.

  2. src/api/tasks.py used asyncio.get_event_loop() inside an async
     handler — deprecated in Python 3.12+, raises in 3.14+. Swapped to
     asyncio.get_running_loop() (the handler is already inside a running
     loop).

  3. docs/install-guide.md stated "expect 256 passing" in three places,
     stale since Phase 1. Updated to 296 to match the current suite.

  No behaviour change. Full suite still green: 296 passed.

