id: BRT-SC-01
timestamp: 2026-04-22T23:30:00Z
type: feat
scope: scoring
title: Replace benchmark subsystem with LLM-research scorer + checkbox curation

summary_human: |
  The old benchmark subsystem — which sent 5 prompts per task_type to every
  model and scored outputs via a hardcoded local judge LLM — is gone.
  In its place: a "Get Model Info" button that asks a web-search LLM to
  research each model's capabilities using published benchmarks, then writes
  relative 0-10 task scores to the matrix.

  Model intake is now operator-curated. The OpenRouter discovery flood
  (300+ models) is replaced by a 12-model curated list in
  data/curated_models.yaml. Every row gets a checkbox in the Models UI.
  Only checked rows are considered by the router — so the operator controls
  the "available pool" directly.

  Unresearched rows default to a flat 5.0 on every task_type. The
  orchestrator softens its 8.0 quality bar to 5.1 when no model qualifies,
  logging BRT-ORC-007-DEGRADED, so the system still routes during a cold
  start or after a matrix wipe.

files_touched:
  - src/registry/models.py              # + checked field on ModelInfo
  - src/registry/capability_matrix.py   # + set_checked, update_pricing; query filter
  - src/registry/router.py              # clearer BRT-REG-020 message
  - src/registry/discovery.py           # OpenRouter now reads curated_models.yaml
  - src/registry/scorer.py              # NEW: research_models, research_and_apply
  - src/api/models.py                   # POST /models/research, PATCH /models/{id}/checked
  - src/orchestrator/engine.py          # quality-bar degrade path
  - ui/models.html                      # 2 sections, checkbox column, Get Info button
  - .env.example                        # SCORING_MODEL*, OPENROUTER_API_KEY
  - data/curated_models.yaml            # NEW: 12 OpenRouter picks
  - data/capability_matrix.yaml         # rewritten with 19 rows + relative scores

files_deleted:
  - src/registry/benchmark.py
  - data/benchmark_prompts.yaml
  - tests/registry/test_benchmark.py

public_surface:
  added:
    - { kind: endpoint, path: "POST /models/research", purpose: "Run the Get Info pass on the full matrix or a subset" }
    - { kind: endpoint, path: "PATCH /models/{model_id:path}/checked", purpose: "Toggle whether a model is in the routing pool" }
    - { kind: field, path: "ModelInfo.checked", purpose: "Boolean gate for the router" }
    - { kind: file, path: "data/curated_models.yaml", purpose: "Operator-curated OpenRouter model pool" }
  removed:
    - { kind: endpoint, path: "POST /models/benchmark/{model_id}", purpose: "Judge-LLM-based benchmarking" }
    - { kind: file, path: "data/benchmark_prompts.yaml", purpose: "Per-task-type benchmark prompts" }

breaking_change: true
breaking_change_notes: |
  POST /models/benchmark/{id} is removed. Callers must migrate to
  POST /models/research (which takes a list of model_ids rather than one).
  The ModelInfo schema gained a `checked: bool = False` field; existing
  matrix YAMLs are forward-compatible (Pydantic defaults fill in the field)
  but will route to zero models until at least one row is checked.

error_codes_added:
  - { code: BRT-REG-030, meaning: "Scorer LLM call failed (HTTP / timeout)" }
  - { code: BRT-REG-031, meaning: "Scorer response could not be parsed as JSON" }
  - { code: BRT-REG-032, meaning: "data/curated_models.yaml missing or malformed" }
  - { code: BRT-ORC-007-DEGRADED, meaning: "Quality bar relaxed from 8.0 to 5.1 because no model qualified" }

error_codes_retired:
  - BRT-REG-014  # judge model failure — no judge now
  - BRT-REG-015  # model-under-test unreachable during benchmark

