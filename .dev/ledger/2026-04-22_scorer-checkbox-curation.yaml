user_guide:
  heading: Curating Your Model Pool (checkboxes) and Researching Capabilities (Get Info)
  how_to_use:
    - Open http://localhost:8000/ui/models.html. You see two tables — LM Studio (local, live-discovered) on top and OpenRouter (12 curated) below.
    - Every row has a checkbox in the first column. Unchecked = invisible to the router. Checked = in the pool.
    - Tick the models you want the orchestrator to be able to use today. Typical: 3-6 total.
    - Click the "Get Model Info" button. A web-search LLM (default perplexity/sonar-pro-search) researches each model's published benchmarks and writes relative 0-10 scores into the matrix. Takes 30-90 seconds.
    - The score cells fill in with per-task numbers (reasoning / coding / summarize / writing / roleplay / agentic / extraction).
    - Pricing for OpenRouter rows is pulled straight from OpenRouter's /models endpoint during Discover.
    - Changes persist to data/capability_matrix.yaml immediately; survive a restart.
  troubleshooting:
    - symptom: '"Get Model Info" fails with BRT-REG-030.'
      cause_and_fix: "The scoring LLM endpoint is unreachable or the API key is wrong. Check SCORING_MODEL_ENDPOINT and OPENROUTER_API_KEY in .env."
    - symptom: '"Get Model Info" fails with BRT-REG-031.'
      cause_and_fix: "The scoring LLM returned unparseable JSON. Usually means you pointed SCORING_MODEL at a model that does not actually support web search. Switch to perplexity/sonar-pro-search or gpt-4o-search-preview."
    - symptom: "The router fails with BRT-REG-020 even though rows exist."
      cause_and_fix: "No row is checked, or none meets the quality bar. Tick at least one row on the Models page, or run Get Model Info so rows have real scores (unchecked rows sit at a flat 5.0)."
    - symptom: "OpenRouter section shows 0 rows after Discover."
      cause_and_fix: "data/curated_models.yaml is missing or empty (BRT-REG-032). Restore from the sample file that ships with the project."

  editing_the_curated_list: |
    To change which 12 OpenRouter models are in the pool, edit
    data/curated_models.yaml, add/remove `- id: <openrouter-id>` entries,
    then restart or hit POST /models/discover. The file doubles as a
    living record of which models the operator has vetted.

install_guide:
  prerequisites_added:
    - A scoring-capable LLM with web search (Perplexity Sonar, GPT-4o Search Preview, or similar) reachable from the configured endpoint.
  setup_steps:
    - "Set OPENROUTER_API_KEY in .env (OpenRouter doubles as the scoring provider by default)."
    - "Optionally override SCORING_MODEL / SCORING_MODEL_ENDPOINT if you prefer a different search-enabled model."
    - "Edit data/curated_models.yaml if you want a different 12-model spread."

presentation:
  hero_bullet: One click, one LLM — every model in the pool gets a relative capability rating grounded in published benchmarks.
  demo_script:
    - Open the Models page. Point at the 7 LM Studio rows + 12 OpenRouter rows. Explain: curated pool, not discovery flood.
    - Point at the "not researched" badges on a fresh row. Click "Get Model Info".
    - Wait ~60s; scores fill in across all rows simultaneously with relative rankings.
    - Tick 4-5 checkboxes to pick a pool for the day's work.
    - Kick a run from the Chat page. The orchestrator now picks from just those 4-5 models; cost is predictable.
  slide_angle: Stop guessing at model quality — let a search-aware LLM do the research, then you pick the pool.
