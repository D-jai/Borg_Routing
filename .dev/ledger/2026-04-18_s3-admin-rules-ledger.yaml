type: feat
scope: slice-3
title: Admin rules ledger — additive governance with audit trail

summary_human: |
  Admins can now append new global rules that inject into every model
  call's governance layer (e.g. "Respond only in English"). Old rules can
  be retired but remain visible in the ledger for audit. This implements
  Law 1 (Uncompacted Governance) at the UI layer — rules are additive,
  never silently edited.

files_touched:
  - src/api/admin.py
  - src/db/schema.py
  - ui/admin.html

public_surface:
  added:
    - { kind: endpoint, path: "GET /config",                       purpose: "Read current config + rules ledger" }
    - { kind: endpoint, path: "POST /config",                      purpose: "Update settings (depth, strategy, etc.)" }
    - { kind: endpoint, path: "POST /config/rules",                purpose: "Append new rule" }
    - { kind: endpoint, path: "POST /config/rules/{id}/retire",    purpose: "Retire a rule (kept for audit)" }

breaking_change: false

error_codes_added:
