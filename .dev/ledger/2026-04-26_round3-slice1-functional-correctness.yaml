title: "Round-3 Slice 1 — three high-severity functional-correctness fixes (BUG-023, BUG-017, BUG-020)"

summary_human: |
  Three bugs from round-3 testing, all of which produced silently wrong
  outputs. Shipped together because they share the property that the
  system lies to the operator without raising — exactly the class of
  bug that erodes trust fastest.

  ## BUG-023 — Router cache stale after PATCH /models/.../checked

  Operators flipping the `checked` flag via the Models UI saw the change
  reflected in `GET /models/matrix` immediately, but the orchestrator
  engine kept routing to the old set until uvicorn restart. This
  masqueraded as a no-op for cost-control operators ("I unchecked the
  expensive thinking model, why is my bill the same?") and made A/B
  comparisons unreliable without a restart between each. Operator hit
  this exact issue in the field running BORG-vs-Sonnet-vs-Perplexity
  comparisons — the BORG-cheap result was actually kimi, not the
  configured sonnet+grok pool.

  Root cause: `engine._shared_matrix` is a module-level singleton loaded
  once at first call; the PATCH handler updates `data/capability_matrix.yaml`
  via `matrix.save()` but never invalidated the engine cache.

  Fix: `engine.reload_matrix()` resets `_shared_matrix = None`. PATCH
  handler calls it after each YAML save. Next router call re-reads from
  YAML (the source of truth). Matrix is tiny so the re-read is cheap.

  This bug also directly undermined yesterday's cold-start slice
  (BRT-INSTALL-FIX-05) — pre-checking Sonnet + Kimi only matters if
  operators can also un-check them at runtime to swap defaults. Without
  this fix the cold-start slice was load-time-only.

  ## BUG-017 — Orchestrator hardcoded training-cutoff year in web_search

  Reasoning models (Kimi K2 Thinking observed; likely others with
  mid-2024 cutoffs) silently injected outdated year tokens into Tavily
  queries when prompts contained "latest" / "today" / "this week" etc.
  Sample query observed in 2026: `"latest space news today 2024 NASA
  JWST breaking"` — the literal "2024" came from the model's training
  cutoff, not from the prompt. Tavily returned 2024-dated results;
  Kimi composed a "latest" answer from those, never noticing the date
  mismatch. End-user got silently stale information.

  Root cause: the orchestrator system prompt does not include the
  current date. Models default to their training cutoff for time-
  sensitive synthesis.

  Fix: a "Wall-Clock Reality" block prepended to the orchestrator stage
  prompt at every assembly site, containing today's UTC date in
  YYYY-MM-DD form and an explicit instruction to never inject a
  hardcoded year that disagrees with it. One block, every call. The
  static prompt template (src/prompts/orchestrator.py — pre-written,
  AGENTS.md-flagged "do not regenerate") is untouched; the date block
  is inserted at runtime via string concatenation in engine.py.

  Out of scope for this slice (noted as BUG-017 fixes #2 and #3 in the
  triage and deferred):
    - Strip standalone year tokens at the web_search tool boundary
    - Pass `time_range` to Tavily when freshness keywords present
  These are belt-and-suspenders defences; the date block alone fixes
  the silent-stale-answer symptom.

  ## BUG-020 — Compose mode result handling (regression of round-2 BUG-010)

  Second occurrence of the same bug pattern. Round-2 BUG-010 nominally
  fixed compose-mode result handling but only covered `direct_answer`
  and `plan.nodes` shapes. When the orchestrator returned a re_plan-
  shaped control signal in compose mode (`{action: "fail|compose|continue"}`),
  every branch fell through and `BRT-ORC-009: compose mode returned no
  response` fired even when stage_results contained perfectly usable
  resolved answerer envelopes. The user's previous answerer work was
  discarded; the run failed instead of completing.

  Owning this: my round-2 ledger (BRT-INSTALL-FIX-03) claimed BUG-010
  fixed; the fix was incomplete. Round-3 testing surfaced the gap. This
  drop fixes all three control-signal shapes with explicit unit tests
  for each, and extracts the handling into a shared decoder so the same
  fix applies to BOTH compose call sites (the main plan→re_plan→compose
  loop AND the empty-plan graceful-fallback branch).

  Fix:
    - New `_handle_compose_result(compose_result, results, run_id, db_path)`
      decoder. Recognises `response`, `direct_answer`, `action=fail`,
      `action=compose`, `action=continue`, and "anything else without a
      response field." When the response is empty and action is missing
      or unknown, falls back to lifting from stage_results via the new
      `_salvage_answer_from_stage_results` helper. Only raises BRT-ORC-009
      when there is genuinely nothing usable anywhere.
    - On action=fail: emits `BUG-020-COMPOSE-DECLINED` trace event;
      returns the rationale as the user-facing response. Run completes
      cleanly instead of 500-ing.
    - On action=compose / action=continue / unknown: emits
      `BUG-020-COMPOSE-USED-STAGE-RESULTS` trace event; lifts the most
      recent resolved answerer envelope's textual content. Recognises
      `output.response`, `output.answer`, `output.text`, `output.content`,
      `output.summary`, plus the bare `output` string for legacy shapes.
    - Empty-plan graceful fallback now also routes through the decoder,
      so the same logic covers both compose call sites.

  ## Tests

  13 new tests in tests/round3/test_slice1_functional_correctness.py:
    - TC-BUG-023-A — reload_matrix() drops the cache
    - TC-BUG-023-B — PATCH handler invokes reload_matrix
    - TC-BUG-017 — assembled stage_prompt contains today's date
    - TC-BUG-020-A..D — _salvage helper (last-resolved, skip-failed,
                       none-when-empty, alternative-key-recognition)
    - TC-BUG-020-E..J — full-loop tests for action=fail / action=compose /
                       direct_answer / response / nothing-usable / empty-
                       plan-with-action=fail

  Suite: 369 -> 382 passed. Zero regressions.

