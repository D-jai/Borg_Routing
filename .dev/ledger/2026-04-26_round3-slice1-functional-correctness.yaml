learnings:
  - "Round-2 BUG-010 'fix' was incomplete — covered direct_answer and
    plan.nodes shapes but missed action=fail / action=compose. When a
    bug recurs, write tests for EVERY branch of the control-signal
    space, not just the one observed in the original repro."
  - "The same handler appearing at two call sites (main loop + empty-
    plan fallback) is a smell — extract it. The shared `_handle_compose_result`
    decoder costs one function but means the next compose-mode bug fix
    lands in one place."
  - "Cache-invalidation footguns are insidious because the UI lies and
    the operator believes the UI. The `reload_matrix()` invalidation
    pattern + the explicit comment about the source-of-truth being the
    YAML file is now the documented contract for runtime matrix updates."
  - "Date-injection at runtime via string-prepend at the assembly site
    (rather than editing the static prompt template) keeps the AGENTS.md
    'do not regenerate prompts/' guard intact while still solving the
    runtime problem. The template stays pristine; the runtime bit lives
    where it belongs."
