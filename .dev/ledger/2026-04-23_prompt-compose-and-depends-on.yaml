id: BRT-PR-01a
timestamp: 2026-04-23T21:15:00Z
type: feat
scope: phase-2
title: Prompt compose-vs-synthesis guidance + answerer depends_on injection

summary_human: |
  Two architectural changes, approved together (pre-written prompts are
  gated by AGENTS.md review). (1) Prompt: ORCHESTRATOR_SYSTEM_PROMPT
  grew a new "Synthesising Fan-Out" section that teaches the orchestrator
  when to synthesise in compose mode using stage_results versus when to
  dispatch an answerer with explicit depends_on. The anti-pattern
  (unwired "final recommendation" node) is called out by name. The
  answerer node template now shows depends_on as a first-class field.
  (2) Engine: _build_task_from_node injects resolved upstream outputs
  into the child's dependency_input.upstream_results and appends an
  "Upstream stage outputs" block to the context string. The ready-check
  ignores depends_on ids that reference nodes not in the plan
  (hallucinations), logging them as BRT-ORC-017 so the dispatch proceeds
  instead of hanging.

